<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Arte de apoio representando o ambiente da barbearia — espaço reservado para foto real da galeria">
  <defs>
    <radialGradient id="bgE" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#2E1C12"/>
      <stop offset="70%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0E0B08"/>
    </radialGradient>
    <linearGradient id="ouroGE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B0"/>
      <stop offset="55%" stop-color="#F2D47B"/>
      <stop offset="100%" stop-color="#C98A33"/>
    </linearGradient>
    <linearGradient id="espelhoE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3A40"/>
      <stop offset="100%" stop-color="#1D2529"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgE)"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="#A96024" stroke-width="2"/>
  <rect x="38" y="38" width="724" height="724" fill="none" stroke="#F2D47B" stroke-width="1" opacity="0.45"/>

  <!-- Espelho redondo -->
  <circle cx="400" cy="250" r="120" fill="url(#espelhoE)" stroke="url(#ouroGE)" stroke-width="7"/>
  <path d="M336,206 q30,-40 84,-36" fill="none" stroke="#E8D8A7" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  <text x="400" y="264" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="6" fill="#F2D47B" opacity="0.6">TELLES</text>

  <!-- Cadeira -->
  <g transform="translate(400,430)">
    <path d="M-70,0 q70,-24 140,0 l-7,60 q-63,-18 -126,0 z" fill="#241B14" stroke="url(#ouroGE)" stroke-width="4"/>
    <rect x="-58" y="62" width="116" height="20" rx="10" fill="#3A2E23" stroke="#A96024" stroke-width="3"/>
    <path d="M-52,84 h104 l12,74 h-128 z" fill="#1D1712" stroke="#A96024" stroke-width="3"/>
    <g fill="#8F2B13" stroke="#A96024" stroke-width="2.5">
      <rect x="-100" y="66" width="24" height="66" rx="11"/>
      <rect x="76" y="66" width="24" height="66" rx="11"/>
    </g>
    <rect x="-12" y="158" width="24" height="26" fill="#3A2E23" stroke="#A96024" stroke-width="2.5"/>
    <ellipse cx="0" cy="192" rx="60" ry="10" fill="#0E0B08" stroke="#A96024" stroke-width="2.5"/>
  </g>

  <text x="400" y="682" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="8" fill="url(#ouroGE)">O ESPAÇO</text>
  <g stroke="#A96024" stroke-width="1.6">
    <line x1="220" y1="704" x2="360" y2="704"/>
    <line x1="440" y1="704" x2="580" y2="704"/>
  </g>
  <path d="M400,697 l7,7 -7,7 -7,-7 z" fill="#F2D47B"/>
  <text x="400" y="748" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#E8D8A7" opacity="0.75">ESPAÇO RESERVADO PARA FOTO REAL</text>
</svg>
