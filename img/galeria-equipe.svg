    <circle cx="0" cy="-62" r="7" fill="#F2D47B"/>
    <text x="0" y="-16" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="5" fill="#F2D47B">TELLES</text>
  </g>

  <text x="400" y="668" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="8" fill="url(#ouroGQ)">A EQUIPE</text>
  <g stroke="#A96024" stroke-width="1.6">
    <line x1="220" y1="692" x2="360" y2="692"/>
    <line x1="440" y1="692" x2="580" y2="692"/>
  </g>
  <path d="M400,685 l7,7 -7,7 -7,-7 z" fill="#F2D47B"/>
  <text x="400" y="740" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#E8D8A7" opacity="0.75">ESPAÇO RESERVADO PARA FOTO REAL</text>
