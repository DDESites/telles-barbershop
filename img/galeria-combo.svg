<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Arte de apoio representando o combo corte e barba — espaço reservado para foto real da galeria">
  <defs>
    <radialGradient id="bgK" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#2E1C12"/>
      <stop offset="70%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0E0B08"/>
    </radialGradient>
    <linearGradient id="ouroGK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B0"/>
      <stop offset="55%" stop-color="#F2D47B"/>
      <stop offset="100%" stop-color="#C98A33"/>
    </linearGradient>
    <linearGradient id="acoK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EC"/>
      <stop offset="100%" stop-color="#B9AC97"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgK)"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="#A96024" stroke-width="2"/>
  <rect x="38" y="38" width="724" height="724" fill="none" stroke="#F2D47B" stroke-width="1" opacity="0.45"/>

  <!-- Emblema pequeno no topo -->
  <g transform="translate(400,180)">
    <circle r="64" fill="#8F2B13" stroke="url(#ouroGK)" stroke-width="4"/>
    <g fill="none" stroke="url(#ouroGK)" stroke-width="4" stroke-linecap="round">
      <g transform="rotate(32)">
        <path d="M0,-46 L4,-16 L2,14 L-2,14 L-4,-16 Z" fill="url(#acoK)" stroke="#A96024" stroke-width="2"/>
        <path d="M-2,18 C-6,34 -10,44 -8,52"/>
        <path d="M2,18 C6,34 10,44 8,52"/>
        <circle cx="-12" cy="60" r="8"/><circle cx="12" cy="60" r="8"/>
      </g>
      <g transform="rotate(-32)">
        <path d="M0,-46 L4,-16 L2,14 L-2,14 L-4,-16 Z" fill="url(#acoK)" stroke="#A96024" stroke-width="2"/>
        <path d="M-2,18 C-6,34 -10,44 -8,52"/>
        <path d="M2,18 C6,34 10,44 8,52"/>
        <circle cx="-12" cy="60" r="8"/><circle cx="12" cy="60" r="8"/>
      </g>
    </g>
  </g>

  <!-- Navalha embaixo -->
  <g transform="translate(400,340) rotate(6)">
    <rect x="-150" y="-20" width="130" height="40" rx="16" fill="#241B14" stroke="url(#ouroGK)" stroke-width="4"/>
    <path d="M-16,-14 q112,-74 224,-58 q18,38 -10,80 q-72,30 -214,22 z" fill="url(#acoK)" stroke="#A96024" stroke-width="3.6"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="7" fill="url(#ouroGK)">CORTE E BARBA</text>
  <g stroke="#A96024" stroke-width="1.6">
    <line x1="200" y1="592" x2="350" y2="592"/>
    <line x1="450" y1="592" x2="600" y2="592"/>
  </g>
  <path d="M400,585 l7,7 -7,7 -7,-7 z" fill="#F2D47B"/>
  <text x="400" y="646" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#E8D8A7" opacity="0.85">O visual completo em um horário só</text>
  <text x="400" y="716" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#E8D8A7" opacity="0.75">ESPAÇO RESERVADO PARA FOTO REAL</text>
</svg>
