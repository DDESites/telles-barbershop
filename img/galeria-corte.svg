<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Arte de apoio representando cortes de cabelo — espaço reservado para foto real da galeria">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#2E1C12"/>
      <stop offset="70%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0E0B08"/>
    </radialGradient>
    <linearGradient id="ouroGC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B0"/>
      <stop offset="55%" stop-color="#F2D47B"/>
      <stop offset="100%" stop-color="#C98A33"/>
    </linearGradient>
    <linearGradient id="acoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EC"/>
      <stop offset="100%" stop-color="#B9AC97"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgC)"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="#A96024" stroke-width="2"/>
  <rect x="38" y="38" width="724" height="724" fill="none" stroke="#F2D47B" stroke-width="1" opacity="0.45"/>

  <!-- Máquina de cortar -->
  <g transform="translate(400,360) rotate(-24)">
    <rect x="-70" y="-190" width="140" height="250" rx="34" fill="#241B14" stroke="url(#ouroGC)" stroke-width="6"/>
    <rect x="-42" y="-160" width="84" height="120" rx="20" fill="#8F2B13" stroke="#A96024" stroke-width="4"/>
    <path d="M-58,60 h116 l10,44 h-136 z" fill="url(#acoG)" stroke="#A96024" stroke-width="4"/>
    <g stroke="#A96024" stroke-width="4">
      <line x1="-52" y1="104" x2="-52" y2="126"/><line x1="-26" y1="104" x2="-26" y2="126"/>
      <line x1="0" y1="104" x2="0" y2="126"/><line x1="26" y1="104" x2="26" y2="126"/>
      <line x1="52" y1="104" x2="52" y2="126"/>
    </g>
    <rect x="-26" y="-10" width="52" height="26" rx="12" fill="#A96024"/>
  </g>

  <text x="400" y="620" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="8" fill="url(#ouroGC)">CORTES</text>
  <g stroke="#A96024" stroke-width="1.6">
    <line x1="230" y1="652" x2="370" y2="652"/>
    <line x1="430" y1="652" x2="570" y2="652"/>
  </g>
  <path d="M400,645 l7,7 -7,7 -7,-7 z" fill="#F2D47B"/>
  <text x="400" y="706" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#E8D8A7" opacity="0.75">ESPAÇO RESERVADO PARA FOTO REAL</text>
</svg>
