<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Arte de apoio representando detalhes e produtos da barbearia — espaço reservado para foto real da galeria">
  <defs>
    <radialGradient id="bgD" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#2E1C12"/>
      <stop offset="70%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0E0B08"/>
    </radialGradient>
    <linearGradient id="ouroGD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7E6B0"/>
      <stop offset="55%" stop-color="#F2D47B"/>
      <stop offset="100%" stop-color="#C98A33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgD)"/>
  <rect x="28" y="28" width="744" height="744" fill="none" stroke="#A96024" stroke-width="2"/>
  <rect x="38" y="38" width="724" height="724" fill="none" stroke="#F2D47B" stroke-width="1" opacity="0.45"/>

  <!-- Prateleira -->
  <rect x="150" y="420" width="500" height="16" rx="6" fill="#3A2E23" stroke="#A96024" stroke-width="3"/>

  <!-- Garrafas e produtos -->
  <g stroke="#A96024" stroke-width="3.4">
    <rect x="190" y="300" width="52" height="120" rx="14" fill="#8F2B13"/>
    <rect x="204" y="278" width="24" height="26" rx="6" fill="#241B14"/>
    <rect x="262" y="262" width="46" height="158" rx="12" fill="#E8D8A7"/>
    <rect x="274" y="240" width="22" height="26" rx="6" fill="#241B14"/>
    <rect x="328" y="330" width="58" height="90" rx="12" fill="#241B14"/>
    <path d="M342,330 v-26 h30 v26" fill="none"/>
  </g>
  <g fill="#F2D47B" opacity="0.85">
    <rect x="200" y="336" width="32" height="8" rx="4"/>
    <rect x="270" y="316" width="30" height="8" rx="4"/>
    <rect x="338" y="362" width="38" height="8" rx="4"/>
  </g>

  <!-- Toalhas dobradas -->
  <g stroke="#A96024" stroke-width="3">
    <rect x="430" y="392" width="150" height="28" rx="12" fill="#E8D8A7"/>
    <rect x="442" y="364" width="150" height="28" rx="12" fill="#F5F2EC"/>
    <rect x="454" y="336" width="150" height="28" rx="12" fill="#E8D8A7"/>
    <rect x="496" y="344" width="14" height="76" fill="#8F2B13" opacity="0.85"/>
  </g>

  <!-- Pequeno emblema -->
  <g transform="translate(400,180)">
    <circle r="58" fill="#8F2B13" stroke="url(#ouroGD)" stroke-width="4"/>
    <path d="M0,-30 l6,18 19,1 -15,12 5,19 -15,-11 -15,11 5,-19 -15,-12 19,-1 z" fill="url(#ouroGD)"/>
  </g>

  <text x="400" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="7" fill="url(#ouroGD)">DETALHES</text>
  <g stroke="#A96024" stroke-width="1.6">
    <line x1="210" y1="592" x2="355" y2="592"/>
    <line x1="445" y1="592" x2="590" y2="592"/>
  </g>
  <path d="M400,585 l7,7 -7,7 -7,-7 z" fill="#F2D47B"/>
  <text x="400" y="646" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#E8D8A7" opacity="0.85">O cuidado está nos detalhes</text>
  <text x="400" y="716" text-anchor="middle" font-family="'Segoe UI', Verdana, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#E8D8A7" opacity="0.75">ESPAÇO RESERVADO PARA FOTO REAL</text>
</svg>
